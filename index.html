<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orchestra Seating Chart — Drag &amp; Drop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#e9ecef;display:flex;height:100vh;overflow:hidden;user-select:none}

#bank{width:270px;min-width:270px;background:#fff;border-right:1px solid #bbb;display:flex;flex-direction:column;height:100vh}
#bank-header{padding:12px 14px;border-bottom:1px solid #ddd;background:#f8f8f8}
#bank-header h2{font-size:15px;color:#333;margin-bottom:8px}.bh-label{font-size:12px;color:#555;display:block;margin-bottom:2px}
#bank-header select,#bank-header input[type=text]{width:100%;padding:4px 8px;margin:0 0 6px;border:1px solid #ccc;border-radius:4px;font-size:13px}.bh-row{display:flex;gap:4px;align-items:center;margin-bottom:4px}.bh-row input[type=number]{width:50px;padding:3px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
#bank-header button{padding:5px 10px;border:1px solid #aaa;border-radius:4px;background:#fff;cursor:pointer;font-size:12px}
#bank-header button:hover{background:#e8e8e8}.tab-bar{display:flex;border-bottom:2px solid #ddd;margin-top:4px}.tab-bar button{flex:1;padding:6px 0;border:none;background:none;cursor:pointer;font-size:12px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px}.tab-bar button.active{color:#4A90D9;border-bottom-color:#4A90D9}

#bank-items{flex:1;overflow-y:auto;padding:10px}.bank-group-header{font-size:12px;font-weight:bold;color:#555;margin:8px 4px 2px;border-bottom:1px solid #eee;padding-bottom:2px}.bank-desk,.bank-wind{
  display:inline-flex;align-items:center;gap:4px;padding:6px 10px;margin:3px;
  border:2px solid #999;border-radius:6px;cursor:grab;font-size:11px;font-weight:600;
  background:#fff;position:relative;
}.bank-desk:active,.bank-wind:active{cursor:grabbing}.bank-desk.swatch,.bank-wind.swatch{width:10px;height:10px;border-radius:2px;border:1px solid #555}.bank-desk.remove-bank,.bank-wind.remove-bank{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;
  background:#e55;color:#fff;font-size:10px;line-height:16px;text-align:center;
  cursor:pointer;display:none;border:none;
}.bank-desk:hover.remove-bank,.bank-wind:hover.remove-bank{display:block}.help-text{font-size:11px;color:#888;margin-top:6px;line-height:1.4}

#main{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
#toolbar{
  position:absolute;top:0;left:0;right:0;z-index:10;
  background:rgba(255,255,255,0.95);border-bottom:1px solid #ccc;
  padding:6px 16px;display:flex;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap;
}
#toolbar label{color:#555}
#toolbar input[type=text]{padding:3px 8px;border:1px solid #ccc;border-radius:4px;font-size:13px;width:200px}.tb-btn{padding:4px 10px;border:1px solid #aaa;border-radius:4px;background:#fff;cursor:pointer;font-size:12px}.tb-btn:hover{background:#e8e8e8}.sep{width:1px;height:20px;background:#ccc}.cb-row{display:flex;align-items:center;gap:4px}.cb-row input{margin:0}.cb-row label{font-size:12px;color:#555}

#canvas-container{flex:1;width:100%;position:relative}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}

#trash-zone{
  position:absolute;bottom:0;left:0;right:0;height:54px;
  background:repeating-linear-gradient(45deg,#f8d7da,#f8d7da 10px,#f5c6cb 10px,#f5c6cb 20px);
  border-top:2px dashed #c0392b;display:flex;align-items:center;justify-content:center;
  z-index:5;opacity:0.4;transition:opacity 0.2s;pointer-events:none;
}
#trash-zone.active{opacity:1}
#trash-zone span{font-size:14px;font-weight:bold;color:#922;pointer-events:none}

#tooltip{position:absolute;pointer-events:none;background:rgba(0,0,0,0.8);color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;display:none;z-index:100;white-space:nowrap}

#name-editor{
  position:absolute;z-index:50;background:#fff;border:1px solid #999;border-radius:6px;
  padding:10px;box-shadow:0 4px 16px rgba(0,0,0,0.2);display:none;min-width:220px;max-width:280px;
}
#name-editor h4{font-size:13px;margin-bottom:6px}
#name-editor input[type=text]{width:100%;padding:3px 6px;border:1px solid #ccc;border-radius:3px;font-size:12px;margin-bottom:4px}
#name-editor input[type=number]{width:55px;padding:3px 6px;border:1px solid #ccc;border-radius:3px;font-size:12px}
#name-editor.ne-row{display:flex;align-items:center;gap:4px;margin-bottom:4px}
#name-editor.ne-row label{font-size:11px;color:#888;min-width:55px}
#name-editor button{padding:3px 8px;border:1px solid #aaa;border-radius:3px;background:#fff;cursor:pointer;font-size:11px;margin-top:2px}
#name-editor.ne-section{border-top:1px solid #eee;margin-top:6px;padding-top:6px}
#name-editor.ne-section-title{font-size:11px;font-weight:600;color:#666;margin-bottom:4px}

@media print{
  #bank,#toolbar,#tooltip,#name-editor,#trash-zone{display:none!important}
  body{background:#fff}
  #main{position:static}
  #canvas-container{position:static}
  canvas{position:static;box-shadow:none;border-radius:0}
}
</style>
</head>
<body>

<div id="bank">
  <div id="bank-header">
    <h2>🎻 Instrument Bank</h2>
    <div class="tab-bar">
      <button class="active" onclick="switchTab('strings',this)">Strings</button>
      <button onclick="switchTab('winds',this)">Winds / Brass / Perc</button>
    </div>
    <div id="add-strings" style="margin-top:8px">
      <span class="bh-label">Section:</span>
      <select id="str-section">
        <option value="Violin I">Violin I</option>
        <option value="Violin II">Violin II</option>
        <option value="Viola">Viola</option>
        <option value="Cello">Cello</option>
        <option value="Bass">Bass</option>
      </select>
      <div class="bh-row">
        <span class="bh-label" style="margin:0">Qty:</span>
        <input type="number" id="str-qty" value="1" min="1" max="20">
        <button onclick="createStringDesks()">+ Add Desks</button>
      </div>
      <div class="help-text">Each desk = 2 players + 1 shared stand.<br>Drag onto stage. Double-click to edit.<br>Drag to trash bar to remove.</div>
    </div>
    <div id="add-winds" style="margin-top:8px;display:none">
      <span class="bh-label">Instrument:</span>
      <select id="wind-section">
        <option value="Flute">Flute</option>
        <option value="Oboe">Oboe</option>
        <option value="Clarinet">Clarinet</option>
        <option value="Bassoon">Bassoon</option>
        <option value="Horn">Horn</option>
        <option value="Trumpet">Trumpet</option>
        <option value="Trombone">Trombone</option>
        <option value="Tuba">Tuba</option>
        <option value="Percussion">Percussion</option>
        <option value="Harp">Harp</option>
        <option value="Piano">Piano</option>
      </select>
      <div class="bh-row">
        <span class="bh-label" style="margin:0">Qty:</span>
        <input type="number" id="wind-qty" value="1" min="1" max="20">
        <button onclick="createWindSeats()">+ Add Seats</button>
      </div>
      <div class="help-text">1 player + own stand. Place anywhere.<br>Double-click to edit name, size, and<br>stand sharing.</div>
    </div>
  </div>
  <div id="bank-items"></div>
</div>

<div id="main">
  <div id="toolbar">
    <label>Title:</label>
    <input type="text" id="chart-title" value="Orchestra Seating Chart">
    <div class="sep"></div>
    <div class="cb-row"><input type="checkbox" id="show-stands" checked><label for="show-stands">Stands</label></div>
    <div class="cb-row"><input type="checkbox" id="show-numbers" checked><label for="show-numbers">Numbers</label></div>
    <div class="cb-row"><input type="checkbox" id="show-labels" checked><label for="show-labels">Labels</label></div>
    <div class="cb-row"><input type="checkbox" id="show-inst-labels" checked><label for="show-inst-labels">Inst. Tags</label></div>
    <div class="sep"></div>
    <button class="tb-btn" onclick="saveChart()">💾 Save</button>
    <button class="tb-btn" onclick="loadChart()">📂 Load</button>
    <button class="tb-btn" onclick="window.print()">🖨 Print</button>
    <button class="tb-btn" onclick="clearStage()">🗑 Clear</button>
    <input type="file" id="load-file" style="display:none" accept=".json">
  </div>
  <div id="canvas-container">
    <canvas id="stage"></canvas>
    <div id="trash-zone"><span>🗑 Drag here to remove</span></div>
  </div>
</div>

<div id="tooltip"></div>
<div id="name-editor">
  <h4 id="ne-title">Edit</h4>
  <div id="ne-fields"></div>
  <button onclick="closeNameEditor()">Done</button>
</div>

<script>
const COLORS={
  'Violin I':'#4A90D9','Violin II':'#7B68EE','Viola':'#50C878',
  'Cello':'#FFB347','Bass':'#FF6B6B','Flute':'#87CEEB',
  'Oboe':'#DDA0DD','Clarinet':'#F0E68C','Bassoon':'#D2B48C',
  'Horn':'#CD853F','Trumpet':'#FF7F50','Trombone':'#BC8F8F',
  'Tuba':'#A0522D','Percussion':'#C0C0C0','Harp':'#E6E6FA','Piano':'#FFDAB9'
};
const DEFAULT_CHAIR=20;
const DEFAULT_WIND_CHAIR=18;

let canvas,ctx,W,H;
let conductorX,conductorY,semiRadius;

// 4 front sections: boundaries[0]=PI (left), boundaries[4]=0 (right)
// Sections: 0=VlnI, 1=VlnII, 2=Viola, 3=Cello
let sectionBoundaries=[];
let sectionNames=['Violin I','Violin II','Viola','Cello'];
let sectionColors=['#4A90D9','#7B68EE','#50C878','#FFB347'];

// Bass inner boundary radius — the arc that separates viola/cello front from bass back
// Bass occupies from bassInnerRadius to semiRadius, spanning the angular range of sections 2+3 (Viola+Cello)
let bassInnerRadius=0;

let placedDesks=[];
let placedWinds=[];
let nextId=1;
let bankStrings=[],bankWinds=[];
let nextBankId=1;
let currentTab='strings';

let dragItem=null,dragItemKind=null;
let dragPlaced=null,dragPlacedKind=null;
let dragOffset={x:0,y:0};
let dragHandle=-1;
let dragRadius=false;
let dragBassHandle=false;
let hoveredHandle=-1,hoveredItem=-1,hoveredItemKind=null;
let hoveredRadiusHandle=false,hoveredBassHandle=false;
let isDragging=false;
const TRASH_H=54;

function recomputeWindNumbers(){
  const g={};
  placedWinds.forEach(w=>{if(!g[w.section])g[w.section]=[];g[w.section].push(w);});
  Object.keys(g).forEach(sec=>{g[sec].sort((a,b)=>a.id-b.id);g[sec].forEach((w,i)=>{w.orderNum=i+1;});});
}

function init(){
  canvas=document.getElementById('stage');
  ctx=canvas.getContext('2d');
  fitCanvas();
  window.addEventListener('resize',fitCanvas);
  initSections();

  [{s:'Violin I',q:6},{s:'Violin II',q:5},{s:'Viola',q:4},{s:'Cello',q:4},{s:'Bass',q:3}].forEach(p=>{
    for(let i=0;i<p.q;i++) bankStrings.push({id:nextBankId++,section:p.s,names:['',''],color:COLORS[p.s],chairSize:DEFAULT_CHAIR});
  });
  buildBankUI();

  canvas.addEventListener('mousedown',onDown);
  canvas.addEventListener('mousemove',onMove);
  canvas.addEventListener('mouseup',onUp);
  canvas.addEventListener('dblclick',onDbl);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());

  ['show-stands','show-numbers','show-labels','show-inst-labels'].forEach(id=>{
    document.getElementById(id).addEventListener('change',draw);
  });
  document.getElementById('chart-title').addEventListener('input',draw);
  document.getElementById('load-file').addEventListener('change',onLoadFile);
  draw();
}

function fitCanvas(){
  const c=document.getElementById('canvas-container');
  W=c.clientWidth;H=c.clientHeight;
  canvas.width=W;canvas.height=H;
  conductorX=W/2;conductorY=(H-TRASH_H)*0.93;
  if(!semiRadius){
    semiRadius=Math.min(W*0.44,(H-TRASH_H)*0.82);
    bassInnerRadius=semiRadius*0.6;
  }
  draw();
}

function initSections(){
  sectionBoundaries=[];
  for(let i=0;i<=4;i++) sectionBoundaries.push(Math.PI-i*(Math.PI/4));
}

// ============================================================
// TABS & BANK
// ============================================================
function switchTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.tab-bar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('add-strings').style.display=tab==='strings'?'block':'none';
  document.getElementById('add-winds').style.display=tab==='winds'?'block':'none';
  buildBankUI();
}

function buildBankUI(){
  const c=document.getElementById('bank-items');c.innerHTML='';
  if(currentTab==='strings'){
    const g={};bankStrings.forEach(d=>{if(!g[d.section])g[d.section]=[];g[d.section].push(d);});
    Object.keys(g).forEach(sec=>{
      gh(c,sec+' ('+g[sec].length+' desks)');
      g[sec].forEach(desk=>{
        const el=mkEl('bank-desk',desk.color,`🎵🎵 ${desk.section}`,()=>{bankStrings=bankStrings.filter(d=>d.id!==desk.id);buildBankUI();});
        el.addEventListener('mousedown',e=>{if(e.button!==0)return;e.preventDefault();startBankDrag(desk,'string',e);});
        c.appendChild(el);
      });
    });
  } else {
    const g={};bankWinds.forEach(d=>{if(!g[d.section])g[d.section]=[];g[d.section].push(d);});
    Object.keys(g).forEach(sec=>{
      gh(c,sec+' ('+g[sec].length+')');
      g[sec].forEach(seat=>{
        const el=mkEl('bank-wind',seat.color,`🎵 ${seat.section}`,()=>{bankWinds=bankWinds.filter(d=>d.id!==seat.id);buildBankUI();});
        el.addEventListener('mousedown',e=>{if(e.button!==0)return;e.preventDefault();startBankDrag(seat,'wind',e);});
        c.appendChild(el);
      });
    });
  }
}
function gh(c,t){const h=document.createElement('div');h.className='bank-group-header';h.textContent=t;c.appendChild(h);}
function mkEl(cls,color,html,onRm){
  const el=document.createElement('div');el.className=cls;el.style.borderColor=color;
  el.innerHTML=`<span class="swatch" style="background:${color}"></span>${html}<button class="remove-bank">✕</button>`;
  el.querySelector('.remove-bank').addEventListener('click',e=>{e.stopPropagation();onRm();});
  return el;
}
function createStringDesks(){
  const sec=document.getElementById('str-section').value;
  const qty=parseInt(document.getElementById('str-qty').value)||1;
  for(let i=0;i<qty;i++)bankStrings.push({id:nextBankId++,section:sec,names:['',''],color:COLORS[sec],chairSize:DEFAULT_CHAIR});
  buildBankUI();
}
function createWindSeats(){
  const sec=document.getElementById('wind-section').value;
  const qty=parseInt(document.getElementById('wind-qty').value)||1;
  for(let i=0;i<qty;i++)bankWinds.push({id:nextBankId++,section:sec,name:'',color:COLORS[sec]||'#AAA',chairSize:DEFAULT_WIND_CHAIR});
  buildBankUI();
}

// ============================================================
// DRAG FROM BANK
// ============================================================
function startBankDrag(item,kind,e){
  const ni={...item,id:nextId++,screenX:e.clientX,screenY:e.clientY};
  if(kind==='string'){ni.names=[...item.names];ni.chairSize=item.chairSize||DEFAULT_CHAIR;bankStrings=bankStrings.filter(d=>d.id!==item.id);}
  else{ni.name=item.name||'';ni.partnerId=null;ni.chairSize=item.chairSize||DEFAULT_WIND_CHAIR;ni.orderNum=0;bankWinds=bankWinds.filter(d=>d.id!==item.id);}
  buildBankUI();dragItem=ni;dragItemKind=kind;isDragging=true;showTrash(true);

  const onM=ev=>{dragItem.screenX=ev.clientX;dragItem.screenY=ev.clientY;draw();};
  const onU=ev=>{
    document.removeEventListener('mousemove',onM);document.removeEventListener('mouseup',onU);
    showTrash(false);isDragging=false;
    const rect=canvas.getBoundingClientRect();const mx=ev.clientX-rect.left,my=ev.clientY-rect.top;
    if(isInTrash(my)){dragItem=null;dragItemKind=null;draw();return;}
    if(mx>=0&&mx<=W&&my>=0&&my<H-TRASH_H){
      if(dragItemKind==='string')placedDesks.push({id:dragItem.id,section:dragItem.section,x:mx,y:my,names:dragItem.names,color:dragItem.color,chairSize:dragItem.chairSize});
      else{placedWinds.push({id:dragItem.id,section:dragItem.section,x:mx,y:my,name:dragItem.name,color:dragItem.color,partnerId:null,chairSize:dragItem.chairSize,orderNum:0});recomputeWindNumbers();}
    } else {
      if(dragItemKind==='string')bankStrings.push({id:nextBankId++,section:dragItem.section,names:[...dragItem.names],color:dragItem.color,chairSize:dragItem.chairSize});
      else bankWinds.push({id:nextBankId++,section:dragItem.section,name:dragItem.name,color:dragItem.color,chairSize:dragItem.chairSize});
      buildBankUI();
    }
    dragItem=null;dragItemKind=null;draw();
  };
  document.addEventListener('mousemove',onM);document.addEventListener('mouseup',onU);
}
function isInTrash(y){return y>=H-TRASH_H;}
function showTrash(s){document.getElementById('trash-zone').classList.toggle('active',s);}

// ============================================================
// HANDLE POSITIONS
// ============================================================
function outerRadiusHandlePos(){return{x:conductorX,y:conductorY-semiRadius};}

function bassHandlePos(){
  // Place the bass handle at the midpoint angle of the bass zone (midpoint of viola+cello angular range)
  const bassStartAngle=sectionBoundaries[2]; // viola left edge
  const bassEndAngle=sectionBoundaries[4];   // cello right edge
  const midAngle=(bassStartAngle+bassEndAngle)/2;
  return{
    x:conductorX+Math.cos(midAngle)*bassInnerRadius,
    y:conductorY-Math.sin(midAngle)*bassInnerRadius,
    angle:midAngle
  };
}

// ============================================================
// CANVAS EVENTS
// ============================================================
function onDown(e){
  if(e.button!==0)return;
  const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  closeNameEditor();

  // Outer radius handle
  const rh=outerRadiusHandlePos();
  if(Math.hypot(mx-rh.x,my-rh.y)<14){dragRadius=true;isDragging=true;return;}

  // Bass inner boundary handle
  const bh=bassHandlePos();
  if(Math.hypot(mx-bh.x,my-bh.y)<14){dragBassHandle=true;isDragging=true;return;}

  // Section boundary handles
  for(let i=1;i<sectionBoundaries.length-1;i++){
    const hx=conductorX+Math.cos(sectionBoundaries[i])*semiRadius,hy=conductorY-Math.sin(sectionBoundaries[i])*semiRadius;
    if(Math.hypot(mx-hx,my-hy)<12){dragHandle=i;return;}
  }

  // Placed desks
  for(let i=placedDesks.length-1;i>=0;i--){
    const d=placedDesks[i],cs=d.chairSize||DEFAULT_CHAIR;
    if(Math.hypot(mx-d.x,my-d.y)<cs*1.3){
      dragPlaced=d;dragPlacedKind='string';dragOffset.x=mx-d.x;dragOffset.y=my-d.y;
      placedDesks.splice(i,1);placedDesks.push(d);isDragging=true;showTrash(true);draw();return;
    }
  }
  // Placed winds
  for(let i=placedWinds.length-1;i>=0;i--){
    const w=placedWinds[i],cs=w.chairSize||DEFAULT_WIND_CHAIR;
    if(Math.hypot(mx-w.x,my-w.y)<cs*0.9){
      dragPlaced=w;dragPlacedKind='wind';dragOffset.x=mx-w.x;dragOffset.y=my-w.y;
      placedWinds.splice(i,1);placedWinds.push(w);isDragging=true;showTrash(true);draw();return;
    }
  }
}

function onMove(e){
  const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;

  if(dragRadius){
    const dy=conductorY-my;
    semiRadius=Math.max(100,Math.min(Math.min(W*0.48,(H-TRASH_H)*0.9),dy));
    if(bassInnerRadius>semiRadius-30)bassInnerRadius=semiRadius-30;
    draw();return;
  }
  if(dragBassHandle){
    const dist=Math.sqrt((mx-conductorX)**2+(my-conductorY)**2);
    bassInnerRadius=Math.max(50,Math.min(semiRadius-30,dist));
    draw();return;
  }
  if(dragHandle>=0){
    const a=Math.atan2(conductorY-my,mx-conductorX);
    sectionBoundaries[dragHandle]=Math.max(sectionBoundaries[dragHandle+1]+0.05,Math.min(sectionBoundaries[dragHandle-1]-0.05,a));
    draw();return;
  }
  if(dragPlaced){
    dragPlaced.x=mx-dragOffset.x;dragPlaced.y=my-dragOffset.y;
    showTrash(true);document.getElementById('trash-zone').classList.toggle('active',isInTrash(my));
    draw();return;
  }

  // Hover detection
  let nh=-1;
  const rh=outerRadiusHandlePos();
  hoveredRadiusHandle=Math.hypot(mx-rh.x,my-rh.y)<14;
  const bh=bassHandlePos();
  hoveredBassHandle=Math.hypot(mx-bh.x,my-bh.y)<14;

  for(let i=1;i<sectionBoundaries.length-1;i++){
    const hx=conductorX+Math.cos(sectionBoundaries[i])*semiRadius,hy=conductorY-Math.sin(sectionBoundaries[i])*semiRadius;
    if(Math.hypot(mx-hx,my-hy)<12){nh=i;break;}
  }
  let ni=-1,nk=null;
  for(let i=placedDesks.length-1;i>=0;i--){const d=placedDesks[i];if(Math.hypot(mx-d.x,my-d.y)<(d.chairSize||DEFAULT_CHAIR)*1.3){ni=d.id;nk='string';break;}}
  if(ni<0){for(let i=placedWinds.length-1;i>=0;i--){const w=placedWinds[i];if(Math.hypot(mx-w.x,my-w.y)<(w.chairSize||DEFAULT_WIND_CHAIR)*0.9){ni=w.id;nk='wind';break;}}}

  if(nh!==hoveredHandle||ni!==hoveredItem){
    hoveredHandle=nh;hoveredItem=ni;hoveredItemKind=nk;
    canvas.style.cursor=hoveredRadiusHandle||hoveredBassHandle?'ns-resize':hoveredHandle>=0?'grab':hoveredItem>=0?'move':'default';
    draw();
  } else {
    canvas.style.cursor=hoveredRadiusHandle||hoveredBassHandle?'ns-resize':hoveredHandle>=0?'grab':hoveredItem>=0?'move':'default';
  }

  const tt=document.getElementById('tooltip');
  if(hoveredItem>=0&&!isDragging){
    let d=hoveredItemKind==='string'?placedDesks.find(dd=>dd.id===hoveredItem):placedWinds.find(dd=>dd.id===hoveredItem);
    if(d){const ns=d.names?d.names.filter(n=>n).join(', '):(d.name||'');tt.textContent=d.section+(d.orderNum?' #'+d.orderNum:'')+': '+(ns||'(unnamed)');tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-10)+'px';tt.style.display='block';}
  } else tt.style.display='none';
}

function onUp(e){
  const rect=canvas.getBoundingClientRect();const my=e.clientY-rect.top;
  if(dragRadius){dragRadius=false;isDragging=false;draw();return;}
  if(dragBassHandle){dragBassHandle=false;isDragging=false;draw();return;}
  if(dragHandle>=0){dragHandle=-1;draw();return;}
  if(dragPlaced){
    if(isInTrash(my)){
      if(dragPlacedKind==='wind'&&dragPlaced.partnerId){const p=placedWinds.find(w=>w.id===dragPlaced.partnerId);if(p)p.partnerId=null;}
      if(dragPlacedKind==='string')placedDesks=placedDesks.filter(d=>d.id!==dragPlaced.id);
      else{placedWinds=placedWinds.filter(d=>d.id!==dragPlaced.id);recomputeWindNumbers();}
    }
    dragPlaced=null;dragPlacedKind=null;isDragging=false;showTrash(false);document.getElementById('trash-zone').classList.remove('active');draw();
  }
}

function onDbl(e){
  const rect=canvas.getBoundingClientRect();const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  for(let i=placedDesks.length-1;i>=0;i--){if(Math.hypot(mx-placedDesks[i].x,my-placedDesks[i].y)<(placedDesks[i].chairSize||DEFAULT_CHAIR)*1.3){openNameEditor(placedDesks[i],'string',e.clientX,e.clientY);return;}}
  for(let i=placedWinds.length-1;i>=0;i--){if(Math.hypot(mx-placedWinds[i].x,my-placedWinds[i].y)<(placedWinds[i].chairSize||DEFAULT_WIND_CHAIR)*0.9){openNameEditor(placedWinds[i],'wind',e.clientX,e.clientY);return;}}
}

function openNameEditor(item,kind,px,py){
  const editor=document.getElementById('name-editor');
  const fields=document.getElementById('ne-fields');fields.innerHTML='';

  if(kind==='string'){
    document.getElementById('ne-title').textContent=item.section+' Desk';
    item.names.forEach((name,i)=>{
      const row=document.createElement('div');row.className='ne-row';
      const lbl=document.createElement('label');lbl.textContent=i===0?'Outside:':'Inside:';
      const inp=document.createElement('input');inp.type='text';inp.value=name;inp.placeholder=i===0?'Outside player':'Inside player';
      inp.addEventListener('input',()=>{item.names[i]=inp.value;draw();});
      row.appendChild(lbl);row.appendChild(inp);fields.appendChild(row);
    });
    addSizeEditor(fields,item,DEFAULT_CHAIR);
  } else {
    document.getElementById('ne-title').textContent=item.section+' #'+(item.orderNum||'?');
    const row=document.createElement('div');row.className='ne-row';
    const lbl=document.createElement('label');lbl.textContent='Name:';
    const inp=document.createElement('input');inp.type='text';inp.value=item.name||'';inp.placeholder='Player name';
    inp.addEventListener('input',()=>{item.name=inp.value;draw();});
    row.appendChild(lbl);row.appendChild(inp);fields.appendChild(row);
    addSizeEditor(fields,item,DEFAULT_WIND_CHAIR);

    // Share stand
    const sec2=document.createElement('div');sec2.className='ne-section';
    const st2=document.createElement('div');st2.className='ne-section-title';st2.textContent='Stand Sharing';sec2.appendChild(st2);
    if(item.partnerId!=null){
      const partner=placedWinds.find(w=>w.id===item.partnerId);
      const info=document.createElement('div');info.style.cssText='font-size:11px;color:#555;margin-bottom:4px';
      info.textContent='Sharing with: '+(partner?(partner.name||partner.section+' #'+partner.orderNum):'?');sec2.appendChild(info);
      const ub=document.createElement('button');ub.textContent='✕ Unlink';ub.style.cssText='color:#c00;border-color:#c00';
      ub.addEventListener('click',()=>{if(partner)partner.partnerId=null;item.partnerId=null;closeNameEditor();draw();});
      sec2.appendChild(ub);
    } else {
      const cands=placedWinds.filter(w=>w.id!==item.id&&w.partnerId==null).map(w=>({w,dist:Math.hypot(w.x-item.x,w.y-item.y)})).sort((a,b)=>a.dist-b.dist).slice(0,5);
      if(cands.length>0){
        const pl=document.createElement('div');pl.style.cssText='font-size:11px;color:#555;margin-bottom:4px';pl.textContent='Share stand with:';sec2.appendChild(pl);
        cands.forEach(({w})=>{
          const btn=document.createElement('button');btn.textContent=(w.name||w.section)+' #'+w.orderNum;btn.style.cssText='display:block;margin:2px 0;width:100%;text-align:left';
          btn.addEventListener('click',()=>{item.partnerId=w.id;w.partnerId=item.id;closeNameEditor();draw();});
          sec2.appendChild(btn);
        });
      } else {const h=document.createElement('div');h.style.cssText='font-size:10px;color:#999';h.textContent='Place another wind player nearby first.';sec2.appendChild(h);}
    }
    fields.appendChild(sec2);
  }
  editor.style.left=Math.min(px,window.innerWidth-290)+'px';
  editor.style.top=Math.min(py,window.innerHeight-300)+'px';
  editor.style.display='block';
}

function addSizeEditor(fields,item,def){
  const sec=document.createElement('div');sec.className='ne-section';
  const st=document.createElement('div');st.className='ne-section-title';st.textContent='Chair Size';sec.appendChild(st);

  sr.appendChild(sl);sr.appendChild(si);

// ============================================================
// DRAWING
// ============================================================
function draw(){
  if(!ctx)return;
  const showStands=document.getElementById('show-stands').checked;
  const showNums=document.getElementById('show-numbers').checked;
  const showLabels=document.getElementById('show-labels').checked;
  const showInstLabels=document.getElementById('show-inst-labels').checked;
  const title=document.getElementById('chart-title').value;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#FAFAFA';ctx.fillRect(0,0,W,H-TRASH_H);
  ctx.fillStyle='#f8e8e8';ctx.fillRect(0,H-TRASH_H,W,TRASH_H);

  ctx.fillStyle='#333';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillText(title,W/2,8);

  drawSections(showLabels);
  if(showStands)drawSharedLinks();
  placedDesks.forEach(d=>drawDeskOnStage(d,showStands,showNums,d.id===hoveredItem&&hoveredItemKind==='string'));
  drawWindsOnStage(showStands,showNums,showInstLabels);
  drawAllHandles();
  drawConductor();

  if(dragItem){
    const rect=canvas.getBoundingClientRect();const mx=dragItem.screenX-rect.left,my=dragItem.screenY-rect.top;
    ctx.globalAlpha=0.55;
    if(dragItemKind==='string')drawDeskAt(mx,my,dragItem,showStands,false,false);
    else drawWindSeatAt(mx,my,dragItem,true,false,false,false);
    ctx.globalAlpha=1;
  }
}

function drawSections(showLabels){
  const cx=conductorX,cy=conductorY;

  // --- Draw the 4 front sections ---
  for(let i=0;i<4;i++){
    const a1=sectionBoundaries[i],a2=sectionBoundaries[i+1];
    const color=sectionColors[i];
    const isBassOverlap=(i===2||i===3); // Viola or Cello — front portion only

    if(isBassOverlap){
      // Front portion: conductor to bassInnerRadius
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,bassInnerRadius,-a1,-a2,false);ctx.closePath();
      ctx.fillStyle=color+'15';ctx.fill();
      ctx.strokeStyle=color+'40';ctx.lineWidth=1;ctx.stroke();
    } else {
      // Full wedge: conductor to semiRadius
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,semiRadius,-a1,-a2,false);ctx.closePath();
      ctx.fillStyle=color+'15';ctx.fill();
      ctx.strokeStyle=color+'40';ctx.lineWidth=1;ctx.stroke();
    }

    // Divider lines from conductor to outer edge
    ctx.setLineDash([4,4]);ctx.strokeStyle='#bbb';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a1)*semiRadius,cy-Math.sin(a1)*semiRadius);ctx.stroke();
    if(i===3){
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a2)*semiRadius,cy-Math.sin(a2)*semiRadius);ctx.stroke();
    }
    ctx.setLineDash([]);

    // Section label
    if(showLabels){
      const midA=(a1+a2)/2;
      const lr=isBassOverlap?bassInnerRadius*0.55:semiRadius*0.55;
      const lx=cx+Math.cos(midA)*lr,ly=cy-Math.sin(midA)*lr;
      ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      const tw=ctx.measureText(sectionNames[i]).width+14,th=22;
      ctx.fillStyle=color+'30';ctx.beginPath();rr(ctx,lx-tw/2,ly-th/2,tw,th,4);ctx.fill();
      ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=darken(color,0.3);ctx.fillText(sectionNames[i],lx,ly);
    }
  }

  // --- Draw the Bass zone (crescent behind Viola + Cello) ---
  const bassA1=sectionBoundaries[2]; // left edge of Viola
  const bassA2=sectionBoundaries[4]; // right edge of Cello
  const bassColor=COLORS['Bass'];

  // Draw the crescent: outer arc - inner arc
  ctx.beginPath();
  ctx.arc(cx,cy,semiRadius,-bassA1,-bassA2,false);     // outer arc (left to right)
  ctx.arc(cx,cy,bassInnerRadius,-bassA2,-bassA1,true);  // inner arc (right to left, closing)
  ctx.closePath();
  ctx.fillStyle=bassColor+'15';ctx.fill();
  ctx.strokeStyle=bassColor+'40';ctx.lineWidth=1;ctx.stroke();

  // Bass inner boundary arc
  ctx.beginPath();
  ctx.arc(cx,cy,bassInnerRadius,-bassA1,-bassA2,false);
  ctx.strokeStyle=bassColor+'60';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);

  // Bass label
  if(showLabels){
    const midA=(bassA1+bassA2)/2;
    const lr=(bassInnerRadius+semiRadius)/2;
    const lx=cx+Math.cos(midA)*lr,ly=cy-Math.sin(midA)*lr;
    ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const tw=ctx.measureText('Bass').width+14,th=22;
    ctx.fillStyle=bassColor+'30';ctx.beginPath();rr(ctx,lx-tw/2,ly-th/2,tw,th,4);ctx.fill();
    ctx.strokeStyle=bassColor;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=darken(bassColor,0.3);ctx.fillText('Bass',lx,ly);
  }

  // Outer arc
  ctx.beginPath();ctx.arc(cx,cy,semiRadius,-Math.PI,0,false);
  ctx.strokeStyle='#999';ctx.lineWidth=2;ctx.stroke();
}

function drawAllHandles(){
  // Section boundary handles on outer arc
  for(let i=1;i<sectionBoundaries.length-1;i++){
    const a=sectionBoundaries[i];
    const hx=conductorX+Math.cos(a)*semiRadius,hy=conductorY-Math.sin(a)*semiRadius;
    const hot=(hoveredHandle===i)||(dragHandle===i);
    ctx.beginPath();ctx.arc(hx,hy,hot?10:8,0,Math.PI*2);
    ctx.fillStyle=hot?'#ff6b35':'#fff';ctx.fill();
    ctx.strokeStyle=hot?'#cc4400':'#888';ctx.lineWidth=2;ctx.stroke();
    ctx.strokeStyle=hot?'#cc4400':'#aaa';ctx.lineWidth=1;
    for(let j=-2;j<=2;j++){ctx.beginPath();ctx.moveTo(hx-4,hy+j*3);ctx.lineTo(hx+4,hy+j*3);ctx.stroke();}
  }

  // Outer radius handle (diamond at top)
  const rh=outerRadiusHandlePos();
  ctx.save();ctx.translate(rh.x,rh.y);
  ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,0);ctx.lineTo(0,10);ctx.lineTo(-8,0);ctx.closePath();
  ctx.fillStyle=dragRadius||hoveredRadiusHandle?'#ff6b35':'#fff';ctx.fill();
  ctx.strokeStyle=dragRadius||hoveredRadiusHandle?'#cc4400':'#666';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  ctx.font='10px sans-serif';ctx.fillStyle='#888';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('↕ resize',rh.x,rh.y-14);

  // Bass inner boundary handle (diamond)
  const bh=bassHandlePos();
  ctx.save();ctx.translate(bh.x,bh.y);
  ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(8,0);ctx.lineTo(0,10);ctx.lineTo(-8,0);ctx.closePath();
  ctx.fillStyle=dragBassHandle||hoveredBassHandle?'#ff6b35':'#ffe0e0';ctx.fill();
  ctx.strokeStyle=dragBassHandle||hoveredBassHandle?'#cc4400':COLORS['Bass'];ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
  ctx.font='10px sans-serif';ctx.fillStyle='#888';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('↕ bass boundary',bh.x,bh.y-14);
}

function drawConductor(){
  const pw=44,ph=32;ctx.fillStyle='#2c2c2c';ctx.strokeStyle='#111';ctx.lineWidth=2;
  ctx.beginPath();rr(ctx,conductorX-pw/2,conductorY-ph-10,pw,ph,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='#ddd';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Conductor',conductorX,conductorY-ph/2-10);
}

// ============================================================
// STRING DESKS
// ============================================================
function drawDeskOnStage(d,ss,sn,hov){drawDeskAt(d.x,d.y,d,ss,sn,hov);}

function drawDeskAt(x,y,desk,showStands,showNums,hovered){
  const cs=desk.chairSize||DEFAULT_CHAIR;
  const pg=cs*0.2,si=cs*0.75;
  const dx=x-conductorX,dy=y-conductorY,ra=Math.atan2(-dy,dx);
  const tx=-Math.sin(ra),ty=-Math.cos(ra),nm=Math.sqrt(tx*tx+ty*ty)||1;
  const ux=tx/nm,uy=ty/nm,off=(cs+pg)/2;
  const p1x=x+ux*off,p1y=y+uy*off,p2x=x-ux*off,p2y=y-uy*off;
  const f1=Math.atan2(conductorY-p1y,conductorX-p1x),f2=Math.atan2(conductorY-p2y,conductorX-p2x);
  drawChair(ctx,p1x,p1y,cs,desk.color,desk.color+'30',desk.names[0]||'',1,showNums,f1,hovered);
  drawChair(ctx,p2x,p2y,cs,desk.color,desk.color+'30',desk.names[1]||'',2,showNums,f2,hovered);
  if(showStands){const dist=Math.sqrt(dx*dx+dy*dy),sr=dist-si;const sx=conductorX+Math.cos(ra)*sr,sy=conductorY-Math.sin(ra)*sr;drawStand(ctx,sx,sy,cs,ra);}
}

// ============================================================
// WIND SEATS
// ============================================================
function drawSharedLinks(){
  const drawn=new Set();
  placedWinds.forEach(w=>{
    if(w.partnerId!=null&&!drawn.has(w.id)){
      const p=placedWinds.find(pp=>pp.id===w.partnerId);
      if(p){drawn.add(w.id);drawn.add(p.id);
        ctx.beginPath();ctx.moveTo(w.x,w.y);ctx.lineTo(p.x,p.y);
        ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);}
    }
  });
}

function drawWindsOnStage(showStands,showNums,showInstLabels){
  const linked=new Set(),drawnShared=new Set();
  placedWinds.forEach(w=>{if(w.partnerId!=null)linked.add(w.id);});
  placedWinds.forEach(w=>{
    const hov=(w.id===hoveredItem&&hoveredItemKind==='wind');
    drawWindSeatAt(w.x,w.y,w,showStands&&!linked.has(w.id),showNums,hov,showInstLabels);
  });
  if(showStands){
    placedWinds.forEach(w=>{
      if(w.partnerId!=null&&!drawnShared.has(w.id)){
        const p=placedWinds.find(pp=>pp.id===w.partnerId);
        if(p){drawnShared.add(w.id);drawnShared.add(p.id);
          const mx2=(w.x+p.x)/2,my2=(w.y+p.y)/2;
          const dx2=mx2-conductorX,dy2=my2-conductorY,ra2=Math.atan2(-dy2,dx2);
          const dist2=Math.sqrt(dx2*dx2+dy2*dy2),bigCs=Math.max(w.chairSize||18,p.chairSize||18);
          const sr2=dist2-bigCs*0.75;
          const sx2=conductorX+Math.cos(ra2)*sr2,sy2=conductorY-Math.sin(ra2)*sr2;
          drawStand(ctx,sx2,sy2,bigCs*1.3,ra2);
        }
      }
    });
  }
}

function drawWindSeatAt(x,y,wind,showStand,showNums,hovered,showInstLabel){
  const cs=wind.chairSize||DEFAULT_WIND_CHAIR;
  const si=cs*0.75;
  const dx=x-conductorX,dy=y-conductorY,ra=Math.atan2(-dy,dx);
  const facing=Math.atan2(conductorY-y,conductorX-x);
  drawChair(ctx,x,y,cs,wind.color,wind.color+'30',wind.name||'',wind.orderNum||0,showNums,facing,hovered);
  if(showStand){const dist=Math.sqrt(dx*dx+dy*dy),sr=dist-si;const sx=conductorX+Math.cos(ra)*sr,sy=conductorY-Math.sin(ra)*sr;drawStand(ctx,sx,sy,cs,ra);}
  if(showInstLabel){
    const tagDist=cs*0.9;
    const tagX=x-Math.cos(facing)*tagDist,tagY=y-Math.sin(facing)*tagDist;
    const abbrev=windAbbrev(wind.section);
    ctx.font=`bold ${Math.max(8,cs*0.4)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    const tw=ctx.measureText(abbrev).width+6,th=Math.max(10,cs*0.45);
    ctx.fillStyle=wind.color+'40';ctx.beginPath();rr(ctx,tagX-tw/2,tagY-th/2,tw,th,3);ctx.fill();
    ctx.fillStyle=darken(wind.color,0.35);ctx.fillText(abbrev,tagX,tagY);
  }
}

function windAbbrev(s){const m={'Flute':'Fl','Oboe':'Ob','Clarinet':'Cl','Bassoon':'Bn','Horn':'Hn','Trumpet':'Tpt','Trombone':'Tbn','Tuba':'Tba','Percussion':'Perc','Harp':'Hp','Piano':'Pno'};return m[s]||s.slice(0,3);}

// ============================================================
// PRIMITIVES
// ============================================================
function drawChair(ctx,x,y,size,color,fill,label,num,showNum,facing,hovered){
  const s=size;
  ctx.save();ctx.translate(x,y);ctx.rotate(facing);
  ctx.beginPath();rr(ctx,-s/2,-s/2,s,s,s*0.2);ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=hovered?'#ff6b35':color;ctx.lineWidth=hovered?3:2;ctx.stroke();
  ctx.restore();
  // Text always upright
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#333';ctx.textAlign='center';ctx.textBaseline='middle';
  if(label&&label.trim()){
    const words=label.trim().split(' ');
    if(words.length>1&&label.length>6){ctx.font=`${Math.max(6,s*0.26)}px sans-serif`;ctx.fillText(words[0],0,-s*0.12);ctx.fillText(words.slice(1).join(' '),0,s*0.16);}
    else{ctx.font=`${Math.max(7,s*0.32)}px sans-serif`;ctx.fillText(label.trim(),0,0);}
  } else if(showNum&&num){ctx.font=`${Math.max(8,s*0.38)}px sans-serif`;ctx.fillText(num,0,0);}
  ctx.restore();
}

function drawStand(ctx,x,y,size,ra){
  ctx.save();ctx.translate(x,y);ctx.rotate(-ra+Math.PI/2);
  const l=size*0.8,s=size*0.14;
  ctx.fillStyle='#6b5b3e';ctx.strokeStyle='#4a3c28';ctx.lineWidth=1;
  ctx.fillRect(-l/2,-s/2,l,s);ctx.strokeRect(-l/2,-s/2,l,s);
  ctx.restore();
}

function rr(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function darken(hex,a){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgb(${Math.floor(r*(1-a))},${Math.floor(g*(1-a))},${Math.floor(b*(1-a))})`;}

// ============================================================
// SAVE / LOAD / CLEAR
// ============================================================
function saveChart(){
  const data={title:document.getElementById('chart-title').value,semiRadius,bassInnerRadius,sectionBoundaries,sectionNames,sectionColors,placedDesks,placedWinds,bankStrings,bankWinds,
    options:{showStands:document.getElementById('show-stands').checked,showNumbers:document.getElementById('show-numbers').checked,showLabels:document.getElementById('show-labels').checked,showInstLabels:document.getElementById('show-inst-labels').checked}};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='orchestra-chart.json';a.click();
}
function loadChart(){document.getElementById('load-file').click();}
function onLoadFile(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=function(ev){
    try{const d=JSON.parse(ev.target.result);
      document.getElementById('chart-title').value=d.title||'';
      semiRadius=d.semiRadius||semiRadius;bassInnerRadius=d.bassInnerRadius||bassInnerRadius;
      sectionBoundaries=d.sectionBoundaries||sectionBoundaries;
      sectionNames=d.sectionNames||sectionNames;sectionColors=d.sectionColors||sectionColors;
      placedDesks=d.placedDesks||[];placedWinds=d.placedWinds||[];
      bankStrings=d.bankStrings||[];bankWinds=d.bankWinds||[];
      nextId=Math.max(...placedDesks.map(dd=>dd.id),...placedWinds.map(dd=>dd.id),0)+1;
      nextBankId=Math.max(...bankStrings.map(dd=>dd.id),...bankWinds.map(dd=>dd.id),0)+1;
      if(d.options){
        document.getElementById('show-stands').checked=d.options.showStands!==false;
        document.getElementById('show-numbers').checked=d.options.showNumbers!==false;
        document.getElementById('show-labels').checked=d.options.showLabels!==false;
        document.getElementById('show-inst-labels').checked=d.options.showInstLabels!==false;
      }
      recomputeWindNumbers();buildBankUI();draw();
    }catch(err){alert('Error: '+err.message);}
  };r.readAsText(f);e.target.value='';
}
function clearStage(){
  if(!confirm('Return all placed items to the bank?'))return;
  placedDesks.forEach(d=>{bankStrings.push({id:nextBankId++,section:d.section,names:[...d.names],color:d.color,chairSize:d.chairSize});});
  placedWinds.forEach(w=>{bankWinds.push({id:nextBankId++,section:w.section,name:w.name,color:w.color,chairSize:w.chairSize});});
  placedDesks=[];placedWinds=[];buildBankUI();draw();
}

window.addEventListener('DOMContentLoaded',init);
</script>
